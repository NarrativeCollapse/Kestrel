---
# ba0fde3d-bee7-4307-b97b-17d0d20aff50
name: Build image
on:
  pull_request:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:
  schedule:
    # Weekly rebuild (Sunday 06:00 UTC) — picks up new EPEL Plasma, kernel and security updates.
    - cron: '0 6 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  set-env:
    if: github.repository != 'AlmaLinux/atomic-respin-template'
    runs-on: ubuntu-latest
    outputs:
      LATEST_TAG: ${{ steps.set.outputs.LATEST_TAG }}
      REGISTRY: ${{ steps.set.outputs.REGISTRY }}
      REGISTRY_USER: ${{ steps.set.outputs.REGISTRY_USER }}
      PLATFORMS: ${{ steps.set.outputs.PLATFORMS }}
      IMAGE_PATH: ${{ steps.set.outputs.IMAGE_PATH }}
      IMAGE_NAME: ${{ steps.set.outputs.IMAGE_NAME }}
      IMAGE_REF: ${{ steps.set.outputs.IMAGE_REF }}
      IS_SIGNED: ${{ steps.set.outputs.IS_SIGNED }}
    steps:
      - name: Checkout github actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set environment variables
        uses: ./.github/actions/config
        id: set
        with:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

  build-image:
    name: Build image
    uses: AlmaLinux/atomic-ci/.github/workflows/build-image.yml@v11
    needs: set-env
    with:
      image-description: "Kestrel: AlmaLinux Atomic KDE Plasma desktop tuned for gaming on Intel graphics"
      containerfile: Dockerfile
      image-name: "${{ needs.set-env.outputs.IMAGE_NAME }}"
      previous-image: "${{ needs.set-env.outputs.IMAGE_REF }}:latest"
      upstream-public-key: atomic-desktop.pub
      platforms: ${{ needs.set-env.outputs.PLATFORMS }}
      skip-maximize-build-space: true
      image-path: ${{ needs.set-env.outputs.IMAGE_PATH }}
      REGISTRY: ${{ needs.set-env.outputs.REGISTRY }}
      REGISTRY_USER: ${{ needs.set-env.outputs.REGISTRY_USER }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    permissions:
      contents: read
      packages: write
      id-token: write

  test-image:
    name: Test image
    runs-on: ubuntu-latest
    needs: [set-env, build-image]

    env:
      IMAGE_REF: "${{ needs.build-image.outputs.image-ref }}@${{ needs.build-image.outputs.digest }}"

    steps:
      - name: Login to Container Registry
        run: echo ${{ secrets.GITHUB_TOKEN }} | podman login -u ${{ needs.set-env.outputs.REGISTRY_USER }} --password-stdin ${{ needs.set-env.outputs.REGISTRY }}

      - name: Test container
        run: |
          # Create a short script to test the image using heredoc
          cat << 'EOF' > /tmp/test.sh
          set -ex

          # Reported, not enforced: packages/modules this build had to skip.
          cat /usr/share/kestrel/missing-optional-packages 2>/dev/null || echo "no optional packages skipped"
          find /usr/lib/modules -name 'xpad.ko*' -o -name 'hid-microsoft.ko*' | sed 's|.*/||'

          cat /etc/os-release
          bootc -V
          rpm -q plasma-workspace kwin mesa-vulkan-drivers
          test -f /usr/lib/sysctl.d/60-kestrel-gaming.conf
          test -f /usr/lib/udev/rules.d/70-kestrel-game-controllers.rules
          test -x /usr/bin/kestrel-flatpak-extras
          grep -q com.valvesoftware.Steam /etc/flatpak/default-flatpaks/system/install
          grep -q io.gitlab.librewolf-community /etc/flatpak/default-flatpaks/system/install
          if rpm -q firefox; then echo "Firefox RPM still installed"; exit 1; fi
          if rpm -qa "plasma-discover*" | grep .; then echo "Discover still installed"; exit 1; fi
          rpm -q plasma-workspace
          grep -q io.github.kolunmi.Bazaar /etc/flatpak/default-flatpaks/system/install
          systemctl is-enabled kestrel-flatpak-update.timer
          systemctl is-enabled kestrel-flatpak-extras.timer
          systemctl is-enabled system-flatpak-setup.timer
          test -x /usr/bin/claude-desktop
          rpm -q qemu-kvm-core edk2-ovmf virtiofsd
          test -e /usr/bin/qemu-system-x86_64
          test -f /usr/share/homebrew.tar.zst
          systemctl is-enabled brew-setup.service brew-update.timer brew-upgrade.timer kestrel-brew-bling.service
          bash -n /etc/profile.d/kestrel-bling.sh
          test -n "$(fc-list 'Symbols Nerd Font')"
          systemctl is-enabled kestrel-os-update.timer bluetooth.service
          if systemctl is-enabled bootc-fetch-apply-updates.timer; then echo "auto-reboot updates still on"; exit 1; fi
          /usr/bin/kestrel help >/dev/null
          test -x /usr/libexec/kestrel-brew-run
          test -f /usr/lib/systemd/system/brew-update.service.d/10-kestrel-owner.conf
          test -f /usr/share/kestrel/logo.txt
          rpm -q podman
          podman --version
          distrobox version
          grep -F kestrel/bling.zsh /etc/zshrc || echo "zsh not installed"
          EOF

          podman run --rm \
            -v /tmp/test.sh:/tmp/test.sh \
            ${{ env.IMAGE_REF }} \
            /bin/bash /tmp/test.sh

  promote-image:
    name: Promote image
    needs: [set-env, build-image, test-image]
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: AlmaLinux/atomic-ci/.github/workflows/retag-image.yml@v11
    with:
      image: ${{ needs.build-image.outputs.image-ref }}
      digest: ${{ needs.build-image.outputs.digest }}
      tag: |
        ${{ needs.set-env.outputs.LATEST_TAG }}
        ${{ needs.build-image.outputs.major-version }}
        ${{ needs.build-image.outputs.redhat-version-id }}
        ${{ needs.build-image.outputs.version }}
      REGISTRY: ${{ needs.set-env.outputs.REGISTRY }}
      REGISTRY_USER: ${{ needs.set-env.outputs.REGISTRY_USER }}
    secrets:
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      packages: write

  # No create-release job: atomic-ci's release step needs SBOMs, and generating one for
  # this image fills the free GitHub runner's disk. Images and ISOs don't depend on it.
