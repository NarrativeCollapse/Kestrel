# Kestrel gaming tuning

# Many Proton/Wine titles (and anything using lots of mmaps) crash at EL's default 65530.
# Same value Fedora, SteamOS and Arch use.
vm.max_map_count = 2147483642

# Don't deliberately slow down processes that trigger split locks (some Windows games
# do this constantly and stutter badly with the mitigation on).
kernel.split_lock_mitigate = 0

# zram-specific swap tuning lives in 61-kestrel-zram.conf (only shipped when zram is available).
