---
# Boots the published image in a VM after each successful "Build image" run on main,
# so a build that installs fine but won't boot is caught before machines update to it.
# The image is already published at this point; a failure here means: don't reboot into
# the staged update, and fix the build.
name: Boot test
on:
  workflow_run:
    workflows: ["Build image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Queue rather than cancel: a run triggered by a cancelled build still starts (its job is
# skipped by the `if` below), and with cancel-in-progress it would cancel a real test.
concurrency:
  group: boot-test
  cancel-in-progress: false

jobs:
  boot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils

      - name: Pull image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPO,,}:latest"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "${TOKEN}" | sudo podman login ghcr.io -u "${ACTOR}" --password-stdin
          sudo podman pull "${IMAGE}"

      - name: Build VM disk
        run: |
          mkdir -p output
          # Throwaway SSH key for a test user, so the test can ask systemd how boot went.
          ssh-keygen -q -t ed25519 -N '' -f boot-test-key
          cp .github/boot-test.toml config.toml
          printf '\n[[customizations.user]]\nname = "kestreltest"\nkey = "%s"\ngroups = ["wheel"]\n' \
            "$(cat boot-test-key.pub)" >> config.toml
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v ./config.toml:/config.toml:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 --rootfs xfs "${IMAGE}"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -lh output/qcow2

      - name: Boot, log in over SSH, check systemd
        run: .github/boot-test.sh output/qcow2/disk.qcow2 boot-test-key

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: boot-test-serial-log
          path: serial.log
          if-no-files-found: ignore
          retention-days: 14
