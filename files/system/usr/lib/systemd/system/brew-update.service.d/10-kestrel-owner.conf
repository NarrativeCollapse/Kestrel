# Kestrel: run as whoever owns Homebrew rather than a fixed UID 1000.
[Service]
User=
# Skip (not fail) until a user account owns Homebrew, e.g. before the first user exists.
ExecCondition=/usr/bin/bash -c 'getent passwd "$$(stat -c %%u /home/linuxbrew/.linuxbrew)" >/dev/null'
ExecStart=
ExecStart=/usr/libexec/kestrel-brew-run update
