---
# GitHub disables scheduled workflows in public repos after 60 days without repository
# activity, which would silently stop the weekly image rebuild. This re-enables them through
# the API every two weeks (the approach keepalive-workflow's API mode uses, no commits).
# If the Actions tab ever shows the build as disabled anyway, click "Enable workflow".
name: Keep scheduled workflows alive
on:
  schedule:
    - cron: '17 5 1,15 * *'   # twice a month
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for wf in build.yml keepalive.yml; do
            gh api -X PUT "repos/${REPO}/actions/workflows/${wf}/enable"
            echo "enabled ${wf}"
          done
